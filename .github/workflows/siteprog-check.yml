name: SiteProg build check

on:
  push:
    branches:
      - programme-buddy-excel-rebuild
      - rebuild/programme-v2
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Export web build
        run: npm run build
