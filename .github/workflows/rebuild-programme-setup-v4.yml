name: Rebuild Programme Setup V4

on:
  push:
    branches:
      - programme-buddy-excel-rebuild
    paths:
      - 'scripts/rebuild-programme-setup-v4.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: programme-buddy-excel-rebuild
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run Programme Setup V4 rebuild
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\rebuild-programme-setup-v4.ps1

      - name: Commit rebuilt files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/sitePlannerStore.tsx" "app/site/setup.tsx" "app/(tabs)/master.tsx" "components/AppScreen.tsx" "components/MasterPlotManager.tsx" "utils/plotMetadata.ts"
          if (git diff --cached --quiet) {
            Write-Host "No generated changes to commit."
            exit 0
          }
          git commit -m "Apply Programme Setup V4 rebuild [skip ci]"
          git push origin HEAD:programme-buddy-excel-rebuild
