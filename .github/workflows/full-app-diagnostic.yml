name: Full SiteProg Diagnostic

# Full regression gate after programme repairs.
on:
  workflow_dispatch:
  push:
    branches:
      - programme-buddy-excel-rebuild
    paths:
      - 'app/**'
      - 'components/**'
      - 'data/**'
      - 'utils/**'
      - 'tests/**'
      - 'scripts/full-app-diagnostic.mjs'
      - '.github/workflows/full-app-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out programme branch
        uses: actions/checkout@v4
        with:
          ref: programme-buddy-excel-rebuild

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install diagnostic browser tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.1 wait-on@8.0.4

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static interaction and numeric-input audit
        run: node scripts/full-app-diagnostic.mjs

      - name: TypeScript diagnostic
        continue-on-error: true
        run: npx tsc --noEmit

      - name: ESLint diagnostic
        continue-on-error: true
        run: npm run lint

      - name: Run browser interaction diagnostics
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          DIAGNOSTIC_BASE_URL: http://127.0.0.1:8084
        run: |
          npx expo start --web --port 8084 --clear > expo.log 2>&1 &
          EXPO_PID=$!
          trap 'kill $EXPO_PID 2>/dev/null || true' EXIT
          npx wait-on http://127.0.0.1:8084 --timeout 120000
          npx playwright test tests/app-diagnostic.spec.mjs --workers=1 --reporter=line

      - name: Production web export
        run: npx expo export --platform web

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteprog-full-diagnostic
          path: |
            diagnostics/
            test-results/
            playwright-report/
            expo.log
          if-no-files-found: ignore
