name: Dependency Hardening

on:
  push:
    branches:
      - programme-dependency-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: programme-dependency-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        run: npm install --no-fund
      - name: Apply compatible audit fixes only
        run: npm audit fix --package-lock-only --no-fund || true
      - name: Install repaired lockfile
        run: npm install --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production web export
        run: npm run build
      - name: Audit after compatible fixes
        run: |
          mkdir -p diagnostics
          npm audit --json > diagnostics/npm-audit-after.json || true
          node -e "const d=require('./diagnostics/npm-audit-after.json'); console.log(JSON.stringify(d.metadata?.vulnerabilities || {}, null, 2));"
      - name: Commit safe dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply compatible dependency security updates [skip ci]"
          git push origin HEAD:programme-dependency-hardening
