name: Four Bed Feedback Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - programme-four-bed-feedback-screenshots
    paths:
      - 'app/**'
      - 'components/**'
      - 'data/**'
      - 'lib/**'
      - 'utils/**'
      - 'tests/**'
      - '.github/workflows/four-bed-feedback-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install diagnostic browser tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.1 wait-on@8.0.4

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static interaction and numeric-input audit
        run: node scripts/full-app-diagnostic.mjs

      - name: TypeScript diagnostic
        run: npx tsc --noEmit

      - name: ESLint diagnostic
        run: npm run lint

      - name: Start Expo web app
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo start --web --port 8084 --clear > expo.log 2>&1 &
          echo $! > expo.pid
          npx wait-on http://127.0.0.1:8084 --timeout 120000

      - name: Run browser interaction diagnostics
        env:
          DIAGNOSTIC_BASE_URL: http://127.0.0.1:8084
        run: npx playwright test tests/app-diagnostic.spec.mjs --workers=1 --reporter=line

      - name: Production web export
        run: npx expo export --platform web

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-bed-feedback-diagnostic
          path: |
            diagnostics/
            test-results/
            playwright-report/
            expo.log
          if-no-files-found: ignore
