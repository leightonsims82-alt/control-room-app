name: Apply SiteProg Diagnostic Fixes

on:
  push:
    branches:
      - programme-buddy-excel-rebuild
    paths:
      - 'scripts/fix-all-diagnostic-findings.mjs'
      - '.github/workflows/fix-all-diagnostic-findings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out programme branch
        uses: actions/checkout@v4
        with:
          ref: programme-buddy-excel-rebuild
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply consolidated repairs
        run: node scripts/fix-all-diagnostic-findings.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint with zero warnings
        run: npx eslint app components data utils --max-warnings=0

      - name: Production web export
        run: npx expo export --platform web
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components data utils tests
          if git diff --cached --quiet; then
            echo "No repaired source changes to commit."
          else
            git commit -m "Fix full diagnostic findings"
            git push origin HEAD:programme-buddy-excel-rebuild
          fi
